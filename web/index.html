<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
<script>
  // Global flag to ensure execution only happens after script finishes loading
  let isCashfreeReady = false;

  window.addEventListener('load', function() {
    // Check every 200ms until the Cashfree object is attached to the window context
    const checkSDK = setInterval(() => {
      if (typeof Cashfree !== 'undefined') {
        isCashfreeReady = true;
        clearInterval(checkSDK);
        console.log("Cashfree V3 Core Engine Loaded Successfully.");
      }
    }, 200);
  });

  function launchCashfreeSubscription(sessionId, onErrorFromDart) {
    if (!isCashfreeReady) {
      onErrorFromDart("Cashfree SDK is still initializing. Please try again in a moment.");
      return;
    }

    try {
      const cashfree = Cashfree({ mode: "sandbox" }); 
      
      cashfree.subscriptionsCheckout({
        subsSessionId: sessionId,
        redirectTarget: "_self" 
      });
    } catch (error) {
      onErrorFromDart(error.message || error.toString());
    }
  }
</script>
</body>
